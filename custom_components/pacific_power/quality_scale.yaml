rules:
  # Bronze
  action-setup:
    status: exempt
    comment: No service actions provided.
  appropriate-polling: done
  brands: todo
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: No service actions provided.
  docs-conditions:
    status: exempt
    comment: No conditions provided.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: No triggers provided.
  entity-event-setup:
    status: exempt
    comment: No entity event subscriptions; entities are coordinator-based.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: No service actions provided.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Cloud-only service, not discoverable on local network.
  discovery-update-info:
    status: exempt
    comment: Cloud-only service, not discoverable on local network.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One device per config entry. New meters/accounts require adding a new integration entry via the config flow, which auto-discovers all available accounts.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: All entities are diagnostic and relevant; none are noisy or niche.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession:
    status: done
    comment: Cannot use HA's shared session — the B2C auth flow requires DummyCookieJar for manual cookie management and session-isolated RSA/AES key state. Sessions are created and closed within each coordinator update cycle.
  strict-typing:
    status: done
    comment: mypy strict config in pyproject.toml. All integration code is fully annotated. Remaining mypy errors are from missing HA type stubs (expected for custom integrations outside HA core).
